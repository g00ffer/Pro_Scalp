[project]
name = "proscalper"
version = "0.1.0"
description = "ProScalping-style crypto futures scalping system"
requires-python = ">=3.11,<3.13"

dependencies = [
    "websockets>=13.0",
    "httpx>=0.27.0",
    "msgspec>=0.18.0",
    "sortedcontainers>=2.4.0",
    "PyYAML>=6.0.2",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proscalper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true