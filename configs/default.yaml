# Конфигурация сборщика рыночных данных
collector:
  # Символы для сбора
  symbols:
    - BTCUSDT
    - ETHUSDT

  # Директория для записи данных
  data_dir: ./data/binance_futures

  # Скорость обновления стакана
  # Возможные значения: 100ms, 250ms, 500ms
  depth_update_speed: 100ms

  # Лимит снапшота стакана
  # Возможные значения: 5, 10, 20, 50, 100, 500, 1000
  snapshot_limit: 100

  # Настройки записи
  batch_size: 1000
  flush_interval_ms: 200
  queue_size: 50000