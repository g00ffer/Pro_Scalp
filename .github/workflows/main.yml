name: Python pytest CI

on:
  push:
    branches: [ "main", "master", "develop", "refactor/**" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' # Меняем на 3.12, так как она указана у вас целевой для ruff/mypy
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Устанавливаем проект [с основными зависимостями] И группу [dev] для тестов
        pip install .[dev]

    - name: Run tests with pytest
      run: |
        # Запускаем через python -m, чтобы гарантированно добавить текущую папку в sys.path
        # Флаг --suppress-no-tests-exit-code (если тестов пока нет) уберет ложное падение
        python -m pytest --suppress-no-tests-exit-code || python -m pytest
